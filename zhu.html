<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>诸神愚戏 · 信仰职业测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', 'Noto Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 20% 30%, #0b0e1a, #03050c);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      color: #e8e6f0;
    }

    /* 主容器 —— 仿若一张被诸神注视的棋盘 */
    .game-container {
      max-width: 680px;
      width: 100%;
      background: rgba(10, 14, 23, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(210, 180, 140, 0.25);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 215, 0, 0.1) inset;
      border-radius: 28px;
      padding: 2rem 1.8rem;
      transition: all 0.3s;
    }

    /* 标题区 */
    .title-section {
      text-align: center;
      margin-bottom: 2rem;
      position: relative;
    }

    .title-section h1 {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: 4px;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.5), 0 0 30px rgba(210, 180, 140, 0.3);
      color: #f5e6c4;
      font-family: 'Times New Roman', 'Songti SC', serif;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #a89f8f;
      letter-spacing: 2px;
      margin-top: 8px;
      border-top: 1px solid rgba(210, 180, 140, 0.3);
      padding-top: 10px;
      display: inline-block;
      padding-left: 20px;
      padding-right: 20px;
    }

    .subtitle span {
      color: #c9b38b;
      font-weight: 400;
    }

    /* 问题卡片 */
    .quiz-area {
      margin-bottom: 2rem;
    }

    .question-index {
      font-size: 0.8rem;
      color: #b8a88a;
      letter-spacing: 1px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .question-index::before {
      content: "◆";
      font-size: 0.6rem;
      color: #c9a861;
    }

    .question-text {
      font-size: 1.35rem;
      font-weight: 500;
      line-height: 1.5;
      margin-bottom: 1.8rem;
      color: #f0e7d8;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.6);
      min-height: 4.5rem;
      padding-right: 0.5rem;
      border-left: 3px solid #c9a861;
      padding-left: 1rem;
    }

    /* 选项列表 */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background: rgba(20, 25, 38, 0.8);
      border: 1px solid rgba(180, 160, 130, 0.3);
      border-radius: 16px;
      padding: 1rem 1.4rem;
      text-align: left;
      font-size: 1rem;
      line-height: 1.5;
      color: #d9d0c0;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      font-weight: 400;
      letter-spacing: 0.3px;
      position: relative;
      overflow: hidden;
    }

    .option-btn::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.05), transparent);
      transform: translateX(-100%);
      transition: transform 0.4s;
    }

    .option-btn:hover {
      border-color: #c9a861;
      background: rgba(35, 42, 58, 0.9);
      color: #f5e6c4;
      box-shadow: 0 0 18px rgba(201, 168, 97, 0.2);
      transform: translateY(-2px);
    }

    .option-btn:hover::after {
      transform: translateX(100%);
    }

    .option-btn:active {
      transform: scale(0.99);
    }

    /* 进度条 */
    .progress-section {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 1.5rem 0 0.8rem;
    }

    .progress-track {
      flex: 1;
      height: 4px;
      background: rgba(60, 55, 70, 0.7);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 0 6px #000 inset;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #c9a861, #f5e6c4);
      border-radius: 4px;
      transition: width 0.35s ease;
      box-shadow: 0 0 10px #e6c27a;
    }

    .progress-text {
      font-size: 0.8rem;
      color: #b8a88a;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    /* 结果页面 */
    .result-area {
      display: none;
      text-align: center;
      padding: 0.5rem 0;
      animation: fadeIn 0.7s ease;
    }

    .result-area.active {
      display: block;
    }

    .quiz-area.hidden {
      display: none;
    }

    .result-sigil {
      font-size: 3.2rem;
      margin-bottom: 0.5rem;
      filter: drop-shadow(0 0 12px #c9a861);
    }

    .result-faith {
      font-size: 1.8rem;
      font-weight: 600;
      color: #f5e6c4;
      letter-spacing: 2px;
      margin-bottom: 6px;
      font-family: 'Times New Roman', 'Songti SC', serif;
    }

    .result-path {
      font-size: 0.95rem;
      color: #b8a88a;
      letter-spacing: 2px;
      margin-bottom: 1.5rem;
      border-bottom: 1px dashed rgba(201, 168, 97, 0.5);
      padding-bottom: 12px;
      display: inline-block;
    }

    .result-class-badge {
      background: rgba(201, 168, 97, 0.12);
      border: 1px solid #c9a861;
      border-radius: 40px;
      padding: 0.6rem 1.8rem;
      display: inline-block;
      font-size: 1.3rem;
      font-weight: 500;
      color: #e6d6b3;
      letter-spacing: 2px;
      margin-bottom: 1.6rem;
      box-shadow: 0 0 20px rgba(201, 168, 97, 0.15);
    }

    .result-desc {
      font-size: 0.98rem;
      line-height: 1.7;
      color: #ccc3b4;
      background: rgba(0, 0, 0, 0.3);
      padding: 1.4rem 1.2rem;
      border-radius: 20px;
      margin: 0.8rem 0 1.8rem;
      text-align: left;
      border-left: 4px solid #c9a861;
      font-style: italic;
    }

    .result-quote {
      font-size: 0.9rem;
      color: #a89f8f;
      margin-bottom: 2rem;
      letter-spacing: 1px;
      padding: 0.5rem;
      border-top: 1px solid rgba(210, 180, 140, 0.2);
      border-bottom: 1px solid rgba(210, 180, 140, 0.2);
    }

    .reset-btn {
      background: transparent;
      border: 1px solid #c9a861;
      color: #c9a861;
      padding: 0.8rem 2.2rem;
      border-radius: 40px;
      font-size: 1rem;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 500;
      box-shadow: 0 0 10px rgba(201, 168, 97, 0.1);
    }

    .reset-btn:hover {
      background: #c9a861;
      color: #0b0e1a;
      box-shadow: 0 0 25px #c9a861;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 小字装饰 */
    .footnote {
      margin-top: 1.8rem;
      font-size: 0.65rem;
      color: #5f5a50;
      text-align: center;
      letter-spacing: 1px;
    }

    @media (max-width: 480px) {
      .game-container {
        padding: 1.5rem 1.2rem;
        border-radius: 20px;
      }
      .title-section h1 {
        font-size: 1.7rem;
        letter-spacing: 2px;
      }
      .question-text {
        font-size: 1.1rem;
        padding-left: 0.8rem;
      }
      .option-btn {
        padding: 0.9rem 1rem;
        font-size: 0.9rem;
      }
      .result-faith {
        font-size: 1.5rem;
      }
      .result-class-badge {
        font-size: 1.1rem;
        padding: 0.5rem 1.2rem;
      }
    }
  </style>
</head>
<body>

  <script>

      const userChoices = []; // 存储每次选择的 resultKey

      const progressText = document.getElementById('progressText');

      // 结果元素
      const resultSigil = document.getElementById('resultSigil');
      const resultFaith = document.getElementById('resultFaith');
      const resultPath = document.getElementById('resultPath');
      const resultClassBadge = document.getElementById('resultClassBadge');
      const resultDesc = document.getElementById('resultDesc');
      const resultQuote = document.getElementById('resultQuote');
      const resetBtn = document.getElementById('resetBtn');

      // ---------- 渲染问题 ----------
      function renderQuestion() {
        const q = QUESTIONS[currentIndex];
        questionIndexEl.textContent = `第 ${currentIndex + 1} / ${QUESTIONS.length} 题`;
        questionTextEl.textContent = q.text;

        // 清空并填充选项
        optionsListEl.innerHTML = '';
        q.options.forEach((opt, idx) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = opt.label;
          btn.dataset.resultKey = opt.resultKey;
          btn.dataset.optIndex = idx;
          btn.addEventListener('click', () => handleOptionClick(opt.resultKey));
          optionsListEl.appendChild(btn);
        });

        // 更新进度
        const percent = Math.round((currentIndex / QUESTIONS.length) * 100);
        progressFill.style.width = percent + '%';
        progressText.textContent = percent + '%';
      }

      // ---------- 处理选项点击 ----------
      function handleOptionClick(resultKey) {
        userChoices.push(resultKey);

        // 进入下一题或结束
        if (currentIndex < QUESTIONS.length - 1) {
          currentIndex++;
          renderQuestion();
        } else {
          // 完成所有题目
          progressFill.style.width = '100%';
          progressText.textContent = '100%';
          showResult();
        }
      }

      // ---------- 计算结果 ----------
      function calculateResult() {
        // 统计每个 resultKey 的出现次数
        const counts = {};
        userChoices.forEach(key => {
          counts[key] = (counts[key] || 0) + 1;
        });

        // 找出出现次数最多的 key
        let maxCount = 0;
        let bestKey = null;

        // 为了在有并列时按某种“信仰倾向”优先级，遍历预设顺序
        // 顺序按照 RESULT_DATA 的键顺序，但实际可以是任意；这里简单用先出现优先，或者按次数排序
        // 更符合直觉：如果并列，选择最先达到最大次数的键（即按选择顺序）
        // 但用户选择顺序存在 userChoices 中，我们按出现顺序来算“最早达到最高分”的
        // 实现：先统计，再遍历 userChoices 找到第一个出现次数等于maxCount的key
        for (let key in counts) {
          if (counts[key] > maxCount) {
            maxCount = counts[key];
            bestKey = key;
          }
        }

        // 如果平票（多个key都是maxCount），按 userChoices 中首次出现顺序选最早的那个
        if (bestKey === null) {
          // 没有选择（理论上不会）
          return 'fraud';
        }

        // 平票处理：找出所有次数等于maxCount的key，再按在userChoices中首次出现的位置排序
        const maxKeys = Object.keys(counts).filter(k => counts[k] === maxCount);
        if (maxKeys.length === 1) {
          return maxKeys[0];
        } else {
          // 按首次出现索引排序
          const firstIndexMap = {};
          userChoices.forEach((key, idx) => {
            if (!(key in firstIndexMap)) {
              firstIndexMap[key] = idx;
            }
          });
          maxKeys.sort((a, b) => firstIndexMap[a] - firstIndexMap[b]);
          return maxKeys[0];
        }
      }

      // ---------- 展示结果 ----------
      function showResult() {
        const resultKey = calculateResult();
        const data = RESULT_DATA[resultKey] || RESULT_DATA.fraud; // fallback

        // 填充结果
        resultSigil.textContent = data.sigil;
        resultFaith.textContent = data.faith;
        resultPath.textContent = data.path;
        resultClassBadge.textContent = data.cls;
        resultDesc.textContent = data.desc;
        resultQuote.textContent = data.quote;

        // 切换显示
        quizArea.classList.add('hidden');
        resultArea.classList.add('active');
      }

      // ---------- 重置测试 ----------
      function resetTest() {
        currentIndex = 0;
        userChoices.length = 0; // 清空数组
        // 重置进度条
        progressFill.style.width = '0%';
        progressText.textContent = '0%';
        // 切换显示
        resultArea.classList.remove('active');
        quizArea.classList.remove('hidden');
        // 重新渲染第一题
        renderQuestion();
      }

      // ---------- 初始化 ----------
      function init() {
        renderQuestion();
        resetBtn.addEventListener('click', resetTest);
      }

      // 启动
      init();
    })();
  </script>
</body>
</html>
